<div class="step_chart">
    <div *ngFor="let step of steps; let i = index" class="step">
      
        <div class="dot_and_connector_container">
            <div class="dot" [ngStyle]="{'background-color': getBackgroundColor(step.status)}"></div>
        
            <div *ngIf="i < steps.length - 1" class="connector"
            [ngStyle]="{'background-color': getBackgroundColor(step.status)}">
            </div>
        </div>

        <div class="text" [class.active]="step.status !== 'pending'">
            <div class="label">{{ step.label }}</div>
            <div class="description">{{ step.description }}</div>
            <div class="time_stamp">{{step.timestamp}}</div>
        </div>
    
    </div>
  </div>
