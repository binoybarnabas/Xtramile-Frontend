<div class="file_container">

    <div *ngFor="let item of fileCard" class="file_card">

        <div class="file_name_section">
            <h4 class="file_name">{{item.fileType}} <i class="ri-checkbox-circle-fill"></i></h4>
            <span class="file_size">{{item.fileSize}}</span>
        </div>

        <div class="description_section">
            <span>{{item.fileName}}</span>
        </div>

        <div class="actions">

            <div class="action_btn">
                <span> <i class="icon ri-eye-line"></i></span>
            </div>

            <div class="action_btn">
                <span><i class="icon ri-file-download-line"></i></span>
            </div>
            
        </div>

    </div>

</div>
