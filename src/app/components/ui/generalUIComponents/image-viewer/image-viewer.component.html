<div class="main_container" [class.side_bar_open]="!isSideNavBarCollapsed">
  
  <div class="close_btn">
    <button class="btn close" (click)="closeImageViewer()"><i class="ri-close-line"></i></button>
  </div>

  <div class="image_container">
    <div *ngIf="image" class="image_wrapper">
      <img class="img" [src]="image" alt="Image" [style.transform]="'scale(' + zoomLevel + ')'" />
    </div>
    <div *ngIf="!image">
      <p>No images to display.</p>
    </div>
  </div>

  <div class="action_section">

    <div class="zoom_actions">
      <button class="btn" (click)="zoomOut()"><i class="ri-zoom-out-line"></i></button>
      <button class="btn" (click)="zoomIn()"><i class="ri-zoom-in-line"></i></button>
    </div>

    <div class="img_description">
      <!-- <span>{{descriptions[currentImageIndex]}}</span> -->
    </div>

    <div class="prev_next_actions">
      <!-- <button class="btn" (click)="prevImage()"><i class="icon_right ri-arrow-left-s-fill"></i></button> -->
      <!-- <button class="btn" (click)="nextImage()"><i class="icon_left ri-arrow-right-s-fill"></i></button> -->
      <button class="btn"><i class="ri-download-cloud-line"></i></button>
    </div>

  </div>

</div>
