<div
  class="modal_header">
  <h6 class="modal_title">Add Travel Options</h6>
  <button type="button" class="exit_button" (click)="closeModal()">
    <i class="icon ri-close-fill"></i>
  </button>
</div>

<div class="modal_body">
  <div class="editor_container">
    <editor
  apiKey="6fbq26b4z6phet50bxxqc7w4ht11my7jsqlyfto1x8jk82pa"
  [(ngModel)]="htmlContent"
  [init]="{
    height: 250,
    width: 400,
    menubar: false,
    plugins: 'wordcount',
    toolbar: 'undo redo | formatselect | bold italic underline | forecolor backcolor | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | removeformat | wordcount'
  }"
></editor>
</div>

<div class="submit_btn_container">
  <button
    class="submit_btn"
    (click)="selectTextOptions()" 
    [disabled]="htmlContent.trim() === ''"
  >
    <i class="icon ri-file-add-line"></i> Add
  </button>
</div>
</div>
