<!-- binding headers,data,displayedProperties(fields to be displayed in table) to child component -->
<app-page-header [headingInputData]="pageHeading"> </app-page-header>

<app-data-table
  [headers]="tableHeaders"
  [data]="incomingRequestdata"
  [displayedProperties]="fieldsToDisplay"
  (rowClick)="selectedRow($event)"
></app-data-table>

<pagination
  [itemsPerPage]="itemsPerPage"
  [totalItems]="totalItems"
  [(ngModel)]="currentPage"
  (pageChanged)="onPageChange($event)"
>
</pagination>
