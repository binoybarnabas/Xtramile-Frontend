<app-page-header [headingInputData]="pageHeading"></app-page-header>

<app-tabbed-data-table
  [tabs]="tabs"
  [filters]="filters"
  (filterToggled)="onFilterToggled($event)"
  (search)="onSearch($event)"
  (tabChange)="onTabChange($event)"
></app-tabbed-data-table>

<pagination
  *ngIf="getTotalItems() > 10"
  [itemsPerPage]="itemsPerPage"
  [totalItems]="getTotalItems()"
  [(ngModel)]="currentPage"
  (pageChanged)="pageChanged($event)"
></pagination>
