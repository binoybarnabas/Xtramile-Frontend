<app-page-header [headingInputData]="pageHeading"> </app-page-header>

<app-travel-request-card *ngIf="totalCount <= 6" [data]="requestData">
</app-travel-request-card>
<app-data-table
  *ngIf="totalCount > 6"
  [headers]="tableHeaders"
  [data]="requestData"
  [displayedProperties]="dataHeaders"
>
</app-data-table>

<pagination
  *ngIf="totalCount > 6"
  [itemsPerPage]="itemsPerPage"
  [totalItems]="totalCount"
  [(ngModel)]="currentPage"
  (pageChanged)="onPageChange($event)"
></pagination>
