<tabset>
  <tab class="tab" heading="Images">
    <app-file-option-viewer></app-file-option-viewer>
  </tab>
  <tab class="tab" heading="Texts">
    <!-- <h3 class="main_heading  mt-5 mb-3 ">Text Options</h3> -->
    <ng-container *ngIf="descriptions.length === 0; else elseblockone">
      <p>There are no text options, check file options</p>
    </ng-container>
    <ng-template #elseblockone>
      <div *ngFor="let item of descriptions; let i = index" class="panel" [ngClass]="{ 'selected_panel': item.optionId === receveingOptionId, 'clicked_panel': item.clicked &&  receveingOptionId == null}">
        <div class="panel_header" (click)="togglePanel(item)">
          Option {{ i + 1 }}
          <!-- Button to confirm option -->
          <div class="expansion_arrow" *ngIf="!item.expanded"><i class="ri-arrow-down-s-line"></i></div>
          <span class="selected_text" *ngIf="item.optionId === receveingOptionId"><i class="ri-arrow-right-s-line"></i>Selected</span>
        </div>
        <div class="panel_content" [@expandCollapse]="item.expanded ? 'expanded' : 'collapsed'">
          <div [innerHTML]="item.htmlString"></div>
        </div>
      </div>
      <div class="text-center mt-5" *ngIf="!buttonActivate && receveingOptionId != null && descriptions.length != 0">
        <app-change-status-button
          [name]="name_ta"
          [empId]="empId"
          [requestId]="requestId"
          [primaryStatusCode]="primaryStatusCode_ta"
          [secondaryStatusCode]="secondaryStatusCode_ta">
        </app-change-status-button>
      </div>
      <div class="d-flex">
        <div class="cancel_btn_container">
          <button *ngIf="buttonActivate && receveingOptionId == null" class="cancel_btn" type="button" (click)="resetSelection()">
            Cancel
          </button>
        </div>
        <span *ngIf="receveingOptionId == null && buttonActivate">
          <app-change-status-button
          [name]="name_rm"
          [empId]="empId"
          [requestId]="requestId"
          [primaryStatusCode]="primaryStatusCode_rm"
          [secondaryStatusCode]="secondaryStatusCode_rm"
          (externalpostTriggered)="confirmOption()"
        ></app-change-status-button>
        </span>
      </div>
    </ng-template>
  </tab>
</tabset>
