<app-page-header [headingInputData]="pageHeading">

</app-page-header>

<app-data-table
  [headers]="tableHeaders"
  [data]="incomingRequestdata"
  [displayedProperties]="fieldsToDisplay"
  (rowClick)="handleSelectedRow($event)"
></app-data-table>

<pagination
[totalItems]="totalCount"
[(ngModel)]="currentPage"
[itemsPerPage]="itemsPerPage"
(pageChanged)="onPageChange($event)"
></pagination>
